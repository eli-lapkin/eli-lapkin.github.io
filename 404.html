<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nibblr</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b94c2d'/><text x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='22' fill='white'>N</text></svg>" />
    <!--
      GitHub Pages serves this page for any path that doesn't exist, so it doubles
      as the landing page for tap links (/t?e=…&c=… from a secure tag, or /t/<code>)
      opened without the app.
      With the app installed, iOS opens the app instead and this page never loads.
    -->
    <link rel="stylesheet" href="site.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      main {
        flex: 1;
        max-width: 520px;
        margin: 0 auto;
        padding: 5rem 1.25rem;
        text-align: center;
      }

      h1 {
        font: 500 clamp(2.2rem, 7vw, 3rem)/1.05 var(--serif);
        letter-spacing: -0.04em;
        margin-bottom: 1rem;
      }

      main p {
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--muted);
        margin-bottom: 2rem;
      }

      .tap { display: none; }
      body.is-tap .tap { display: block; }
      body.is-tap .not-found { display: none; }
    </style>
  </head>
  <body>
    <script>
      var params = new URLSearchParams(location.search);
      var secureTap = /^\/t\/?$/.test(location.pathname) && params.has("e") && params.has("c");
      if (secureTap || /^\/t\/[A-Za-z0-9_-]+\/?$/.test(location.pathname)) {
        document.body.classList.add("is-tap");
      }
    </script>

    <nav>
      <a class="nav-logo" href="/">Nibblr</a>
    </nav>

    <main>
      <div class="tap">
        <div class="hero-badge">Nibblr punch card</div>
        <h1>Collect your punch with the Nibblr app</h1>
        <p>
          Get the app, sign up, and tap the tag at the register again.
          One punch per visit, spendable at any Nibblr restaurant.
        </p>
        <!-- TODO: replace with the App Store link once the app is published -->
        <a class="btn-primary" href="/#waitlist">Get the app</a>
      </div>

      <div class="not-found">
        <div class="hero-badge">404</div>
        <h1>Page not found</h1>
        <p>This page doesn't exist, but there's plenty to eat back home.</p>
        <a class="btn-primary" href="/">Go to Nibblr</a>
      </div>
    </main>
    <!-- Cloudflare Web Analytics: counts visits, no cookies -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "28426744a4f84bf8960464baaa427e53"}'></script>
  </body>
</html>
